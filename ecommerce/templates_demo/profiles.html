{% extends "index.html"%}
{% load static %}
{% block content %}

<h2>Create New Profile</h2>
<form method="POST">
  {% csrf_token %}
  <input type="text" name="first_name" placeholder="First Name" required>
  <input type="text" name="last_name" placeholder="Last Name" required>
  <input type="email" name="email" placeholder="Email" required>
  <button type="submit">Create</button>
</form>

<h2>All Profiles</h2>
<table border="1">
  <tr>
    <th>Name</th><th>Email</th><th>Actions</th>
  </tr>
  {% for profile in profiles %}
  <tr>
    <td>{{ profile.first_name }} {{ profile.last_name }}</td>
    <td>{{ profile.email }}</td>
    <td>
      <button onclick="window.location.href='{% url 'profile_detail' profile.id %}'">View</button>
      <button onclick="window.location.href='{% url 'profile_update' profile.id %}'">Edit</button>
      <button onclick="if(confirm('Are you sure to delete?')) { window.location.href='{% url 'profile_detail' profile.id %}'; }">Delete</button>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
