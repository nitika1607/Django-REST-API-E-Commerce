<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Profile Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            color: #333;
        }

        form {
            margin-bottom: 30px;
        }

        input[type="text"],
        input[type="email"] {
            padding: 8px;
            margin: 5px 10px 5px 0;
            width: 200px;
        }

        button {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .action-btns button {
            background-color: #2196F3;
        }

        .action-btns button:last-child {
            background-color: #f44336;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}


</body>
</html>
