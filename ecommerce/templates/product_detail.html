{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.title }}">
        </div>
        <div class="col-md-6">
            <h2>{{ product.title }}</h2>
            <p>{{ product.description }}</p>
            <h4>Price: {{ product.price }}</h4>
            <a href="#" class="btn btn-primary">{{ product.button }}</a>
        </div>
    </div>
</div>

{% endblock %}
